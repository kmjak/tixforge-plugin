# tixforge template: tixforge-issue-sync (v6). Installed by /tixforge:project init.
# Keeps the status label of tixforge issues in step with pull requests, so
# the issue shows the real state even when nobody runs /tixforge:dev:
#   PR opened / reopened / ready for review  -> tixforge:in-review
#   open PR's body edited (Closes #N added)  -> tixforge:in-review
#       (not an issue already tixforge:merged: a release PR from develop
#       links it again, and it is still waiting for the release)
#   PR merged into the default branch        -> tixforge:done, and closed
#       (an issue closes when it is released: it reaches the default branch)
#   PR merged into another branch (develop)  -> tixforge:merged, left open
#   release PR merged into the default branch: every open tixforge:merged
#       issue its commits close -> tixforge:done, and closed. The commits'
#       messages and the bodies of the PRs that brought them into develop
#       are read, so a squash that dropped Closes #N on either merge does
#       not matter
#   issue closed as completed while tixforge:merged -> tixforge:done (released;
#       closed as not planned is a cancel, which tixforge:canceled records)
# "Linked" means the PR body says Closes / Fixes / Resolves #N (as a word of
# its own: "hotfix #12" is not a link), and only
# issues that carry a tixforge:* label are touched. Pull requests from forks
# are not supported (their token is read-only; see the README).
name: tixforge-issue-sync

on:
  pull_request:
    types: [opened, reopened, ready_for_review, edited, closed]
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Update the status labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR_STATE: ${{ github.event.pull_request.state }}
          BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          ISSUE_REASON: ${{ github.event.issue.state_reason }}
        run: |
          STATUS="tixforge:todo tixforge:in-progress tixforge:in-review tixforge:merged tixforge:done tixforge:canceled"
          # set_status <n> <labels,> <want>: exactly one status label.
          set_status() {
            args=""
            for l in $STATUS; do
              [ "$l" = "$3" ] && continue
              case ",$2," in *",$l,"*) args="$args --remove-label $l" ;; esac
            done
            # shellcheck disable=SC2086 # $args is a list of flags
            gh issue edit "$1" $args --add-label "$3"
          }

          if [ "$EVENT" = issues ]; then
            # A release closed the issue (Closes #N in a commit reaching the
            # default branch): merged -> done. Not when it was closed as not
            # planned (a cancel): done would make it look completed.
            [ "$ISSUE_REASON" = completed ] || exit 0
            case ",$ISSUE_LABELS," in
              *,tixforge:merged,*) set_status "$ISSUE" "$ISSUE_LABELS" tixforge:done ;;
            esac
            exit 0
          fi

          # linked: the issue numbers a text closes (Closes / Fixes / Resolves
          # #N, each a word of its own), one per line.
          linked() {
            { grep -Eio '(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' || true; } \
              | grep -Eo '#[0-9]+' | tr -d '#' | sort -u
          }
          # done_and_close <n> <state> <labels,>
          done_and_close() {
            set_status "$1" "$3" tixforge:done
            if [ "$2" = OPEN ]; then
              gh issue close "$1" --comment "Closed by tixforge-issue-sync: $PR_URL merged"
            fi
          }

          # An edit of a closed PR (merged or not) does not move its issues.
          if [ "$ACTION" = edited ] && [ "$PR_STATE" != open ]; then exit 0; fi

          # A release: the open issues its commits close that wait in
          # tixforge:merged are released now. The commits come from compare
          # (no 250-commit cap); a failed call fails the job (bash -e).
          if [ "$ACTION" = closed ] && [ "$MERGED" = true ] && [ "$BASE_REF" = "$DEFAULT_BRANCH" ]; then
            shas=$(gh api "repos/$GH_REPO/compare/$BASE_SHA...$HEAD_SHA" --paginate --jq '.commits[].sha')
            texts=$(gh api "repos/$GH_REPO/compare/$BASE_SHA...$HEAD_SHA" --paginate --jq '.commits[].commit.message')
            for sha in $shas; do
              bodies=$(gh api "repos/$GH_REPO/commits/$sha/pulls" --jq '.[].body // empty')
              texts=$(printf '%s\n%s' "$texts" "$bodies")
            done
            released=$(printf '%s\n' "$texts" | linked)
            for n in $released; do
              info=$(gh issue view "$n" --json state,labels \
                --jq '.state + " " + ([.labels[].name] | join(","))' 2>/dev/null) || continue
              [ "${info%% *}" = OPEN ] || continue
              case ",${info#* }," in *,tixforge:merged,*) done_and_close "$n" OPEN "${info#* }" ;; esac
            done
          fi

          issues=$(printf '%s\n' "$BODY" | linked)
          [ -n "$issues" ] || { echo "no linked issue"; exit 0; }
          for n in $issues; do
            info=$(gh issue view "$n" --json state,labels \
              --jq '.state + " " + ([.labels[].name] | join(","))' 2>/dev/null) || continue
            state=${info%% *}; labels=${info#* }
            case ",$labels," in *,tixforge:*) ;; *) echo "#$n is not a tixforge issue"; continue ;; esac
            if [ "$ACTION" = closed ]; then
              [ "$MERGED" = true ] || continue
              # Merged into develop: waiting for the release, open.
              if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
                set_status "$n" "$labels" tixforge:merged
                continue
              fi
              done_and_close "$n" "$state" "$labels"
            elif [ "$DRAFT" != true ] && [ "$state" = OPEN ]; then
              # Merged into the base, waiting for the release: keep it.
              case ",$labels," in *,tixforge:merged,*) continue ;; esac
              set_status "$n" "$labels" tixforge:in-review
            fi
          done
